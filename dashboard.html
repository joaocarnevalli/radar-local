<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0c">
  <title>Radar Local · Painel</title>
  <link rel="stylesheet" href="dashboard.css">
  <script src="dashboard.js" defer></script>
</head>
<body>
  <div class="dashboard-app">
    <aside class="sidebar" aria-label="Navegação do Radar">
      <a class="brand-lockup" href="#monitorados" aria-label="Radar Local · início">
        <img src="icons/radar.svg" alt="" class="brand-mark">
        <span class="brand-copy"><strong>Radar <em>Local</em></strong><small>Seu espaço de preços</small></span>
      </a>

      <div class="nav-label">ESPAÇO DE TRABALHO</div>
      <nav class="side-nav" aria-label="Seções">
        <button class="side-nav-link active" type="button" data-view="itemsView" data-title="Monitorados" aria-current="page">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><circle cx="10" cy="10" r="2.5"/><path d="m10 10 4.7-4.7"/></svg>
          <span>Monitorados</span>
        </button>
        <button class="side-nav-link" type="button" data-view="foldersView" data-title="Pastas">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5.5h6l1.6 1.8h7.4v8.2H2.5z"/><path d="M2.5 5.5V4.2h5.7l1.5 1.3"/></svg>
          <span>Pastas</span>
        </button>
        <button class="side-nav-link" type="button" data-view="settingsView" data-title="Configurações">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="m16.4 11.8 1 .8-1.4 2.4-1.2-.5a7 7 0 0 1-1.4.8l-.2 1.3h-2.8l-.2-1.3a7 7 0 0 1-1.4-.8l-1.2.5-1.4-2.4 1-.8a6 6 0 0 1 0-1.6l-1-.8 1.4-2.4 1.2.5a7 7 0 0 1 1.4-.8l.2-1.3h2.8l.2 1.3a7 7 0 0 1 1.4.8l1.2-.5 1.4 2.4-1 .8a6 6 0 0 1 0 1.6Z"/></svg>
          <span>Configurações</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <span class="local-mark" aria-hidden="true"><i></i></span>
        <span><strong>Armazenamento local</strong><small>Seus dados ficam neste navegador.</small></span>
      </div>
    </aside>

    <section class="workspace">
      <header class="workspace-header">
        <div class="workspace-heading">
          <span class="eyebrow">RADAR LOCAL <span aria-hidden="true">/</span> PAINEL</span>
          <h1 id="activeViewTitle">Monitorados</h1>
        </div>
        <div class="workspace-tools">
          <button id="dashboardExport" class="workspace-action" type="button" title="Exportar backup JSON" aria-label="Exportar backup JSON" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.75v9.5m0 0 3.5-3.5M10 12.25l-3.5-3.5M3.5 14v2.25h13V14"/></svg><span>Backup</span>
          </button>
          <button id="dashboardFloating" class="workspace-action" type="button" title="Abrir janela flutuante" aria-label="Abrir janela flutuante" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11 3.5h5.5V9M16 3.5 9 10.5M15.5 11.5v4.25a.75.75 0 0 1-.75.75H4.25a.75.75 0 0 1-.75-.75V5.25a.75.75 0 0 1 .75-.75H9"/></svg><span>Janela flutuante</span>
          </button>
          <div class="workspace-status"><span class="status-dot" aria-hidden="true"></span>Somente neste navegador</div>
        </div>
      </header>
      <main class="workspace-content">
        <iframe id="radarApp" src="popup.html?dashboard=1&amp;embedded=1" title="Painel completo do Radar Local"></iframe>
      </main>
    </section>
  </div>
</body>
</html>

name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Referências de arquivos e pacote
        run: node tools/check-files.cjs

      - name: Testes unitários
        run: node --test tests/data.test.cjs

      # O Google Chrome oficial (137+) ignora --load-extension; o Chrome for Testing aceita.
      - name: Instalar Chrome for Testing
        run: |
          npx -y @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/browsers"
          chrome=$(find "$RUNNER_TEMP/browsers" -type f -name chrome -path '*chrome-linux64*' | head -n 1)
          test -x "$chrome"
          "$chrome" --version
          echo "RADAR_BROWSER=$chrome" >> "$GITHUB_ENV"

      - name: Testes no navegador (headless, fixtures locais)
        run: node tests/browser.cjs

      - name: Guardar capturas em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-do-teste
          path: .test-artifacts/**/*.png
          if-no-files-found: ignore
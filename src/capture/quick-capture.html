<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usar seleção como preço · Radar Local</title>
  <link rel="stylesheet" href="quick-capture.css">
</head>
<body>
  <main class="capture-shell">
    <header>
      <span class="brand-mark" aria-hidden="true"><img src="../../assets/icons/radar.svg" alt=""></span>
      <div class="brand-copy"><strong>Radar Local</strong><small>Revisar preço selecionado</small></div>
    </header>
    <div id="captureStatus" class="status">Lendo seleção…</div>
    <form id="captureForm" class="hidden">
      <label>Produto<input id="captureName" maxlength="140" required></label>
      <label>Texto selecionado<textarea id="captureSelection" rows="3" readonly></textarea></label>
      <label>Valor a salvar<input id="captureAmount" inputmode="decimal" placeholder="Ex.: 1.899,90" required></label>
      <label>Moeda<input id="captureCurrency" maxlength="3" placeholder="BRL, USD, EUR…" aria-label="Código da moeda"></label>
      <label>Este valor é<select id="captureKind"><option value="current">Preço atual</option><option value="regular">Preço normal / anterior</option></select></label>
      <label id="captureFolderLabel">Pasta<select id="captureFolder"></select></label>
      <div class="url" id="captureUrl"></div>
      <div class="actions"><button class="primary" type="submit">Salvar valor</button><button id="cancelCapture" class="secondary" type="button">Cancelar</button></div>
      <small class="form-note">Confira se a seleção é o preço atual ou o preço normal antes de salvar. O valor será registrado como entrada manual.</small>
    </form>
  </main>
  <script src="../shared/money.js"></script>
  <script src="../shared/data-store.js"></script>
  <script src="quick-capture.js"></script>
</body>
</html>
